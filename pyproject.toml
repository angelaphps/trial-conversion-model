[project]
name = "trial-conversion-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angela Phillips", email = "angela.phillips@figured.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg>=3.3.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.1",
    "xgboost>=3.2.0",
]

[project.scripts]
trial-conversion-model = "trial_conversion_model:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
